<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F5F0;
    --ink:#1C2321;
    --ink-soft:#5B6560;
    --teal:#2F5D62;
    --teal-deep:#1E4145;
    --rust:#B5502D;
    --line:#DAD5C9;
    --card:#FFFFFF;
    --good:#3C6E47;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    display:flex;
    min-height:100vh;
  }
  /* Sidebar */
  .sidebar{
    width:220px;
    flex-shrink:0;
    border-right:1px solid var(--line);
    padding:28px 0;
    display:flex;
    flex-direction:column;
  }
  .brand{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:20px;
    padding:0 24px 22px 24px;
    border-bottom:1px solid var(--line);
    margin-bottom:8px;
    letter-spacing:0.2px;
  }
  .brand span{color:var(--teal);}
  nav{display:flex;flex-direction:column;margin-top:6px;}
  .navbtn{
    text-align:left;
    background:none;
    border:none;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    color:var(--ink-soft);
    padding:11px 24px;
    cursor:pointer;
    border-left:3px solid transparent;
    transition:background .15s, color .15s, border-color .15s;
  }
  .navbtn:hover{background:rgba(47,93,98,0.06); color:var(--ink);}
  .navbtn.active{
    color:var(--teal-deep);
    border-left-color:var(--teal);
    background:rgba(47,93,98,0.08);
    font-weight:500;
  }
  .sidebar-foot{
    margin-top:auto;
    padding:14px 24px 0 24px;
    font-size:11.5px;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
  }
  /* Main */
  main{
    flex:1;
    padding:34px 44px 60px 44px;
    max-width:1080px;
  }
  h1{
    font-family:'Source Serif 4', serif;
    font-size:26px;
    font-weight:600;
    margin:0 0 4px 0;
  }
  .subtitle{color:var(--ink-soft); font-size:14px; margin:0 0 28px 0;}
  .grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:30px;
  }
  .stat{
    background:var(--card);
    border:1px solid var(--line);
    padding:16px 18px;
  }
  .stat .label{font-size:12px; color:var(--ink-soft); margin-bottom:6px;}
  .stat .value{font-family:'IBM Plex Mono',monospace; font-size:21px; font-weight:600; font-variant-numeric:tabular-nums;}
  .stat .value.rust{color:var(--rust);}
  .stat .value.good{color:var(--good);}

  section.block{margin-bottom:36px;}
  .block-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid var(--ink);
    padding-bottom:8px;
    margin-bottom:14px;
  }
  .block-head h2{
    font-family:'Source Serif 4', serif;
    font-size:18px;
    font-weight:600;
    margin:0;
  }
  .block-head .count{font-size:12px; color:var(--ink-soft);}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{
    text-align:left;
    font-weight:500;
    color:var(--ink-soft);
    font-size:11.5px;
    padding:0 10px 8px 0;
    border-bottom:1px solid var(--line);
  }
  td{
    padding:9px 10px 9px 0;
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  td.num, th.num{text-align:right; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  tr:last-child td{border-bottom:1px solid var(--line);}
  .empty-row td{color:var(--ink-soft); font-style:italic; padding:16px 0;}
  .tag{
    display:inline-block;
    font-size:11px;
    padding:2px 7px;
    border:1px solid var(--line);
  }
  .tag.overdue{border-color:var(--rust); color:var(--rust);}
  .tag.paid{border-color:var(--good); color:var(--good);}
  .tag.open{border-color:var(--teal); color:var(--teal-deep);}
  .del-btn{
    background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:13px;
    padding:2px 6px;
  }
  .del-btn:hover{color:var(--rust);}

  /* form */
  .form-card{
    background:var(--card);
    border:1px solid var(--line);
    padding:18px 20px;
    margin-bottom:24px;
  }
  .form-card h2{
    font-family:'Source Serif 4', serif;
    font-size:16px;
    margin:0 0 14px 0;
  }
  .form-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:flex-end;
    margin-bottom:12px;
  }
  .field{display:flex; flex-direction:column; gap:5px; min-width:130px; flex:1;}
  .field label{font-size:11.5px; color:var(--ink-soft);}
  .field input, .field select{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:8px 9px;
    border:1px solid var(--line);
    background:#FDFCFA;
    color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:1.5px solid var(--teal);}
  .field.amount-preview input{font-family:'IBM Plex Mono',monospace;}
  .submit-btn{
    background:var(--teal-deep);
    color:#fff;
    border:none;
    padding:9px 18px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    height:37px;
  }
  .submit-btn:hover{background:var(--teal);}
  .hint{font-size:12px; color:var(--ink-soft); margin-top:-4px; margin-bottom:10px;}
  .err{color:var(--rust); font-size:12.5px; margin-top:6px; display:none;}

  .badge-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:2px;}

  @media (max-width:820px){
    .app{flex-direction:column;}
    .sidebar{width:100%; flex-direction:row; overflow-x:auto; padding:14px 8px;}
    .brand{display:none;}
    nav{flex-direction:row;}
    .navbtn{border-left:none; border-bottom:3px solid transparent; white-space:nowrap;}
    .navbtn.active{border-bottom-color:var(--teal);}
    .sidebar-foot{display:none;}
    main{padding:22px 16px 50px 16px;}
    .grid{grid-template-columns:repeat(2,1fr);}
    table{font-size:12.5px;}
    th:nth-child(n+5), td:nth-child(n+5){display:none;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand"><span>Stock</span> Ledger</div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">Trade &amp; credit tracker<br>Data saved to your account</div>
  </div>
  <main id="main"></main>
</div>

<script>
const state = { purchases: [], sales: [], payments: [], tab: 'dashboard', loaded: false, invoiceDraft: null, importing: false, importError: '' };

const TABS = [
  {id:'dashboard', label:'Dashboard'},
  {id:'purchases', label:'Purchases'},
  {id:'sales', label:'Sales'},
  {id:'payments', label:'Payments'},
  {id:'stock', label:'Stock by item'},
  {id:'parties', label:'Customer dues'},
];

function fmt(n){
  n = Number(n)||0;
  return n.toLocaleString('en-IN', {maximumFractionDigits:2, minimumFractionDigits: (n%1!==0?2:0)});
}
function money(n){ return '₹' + fmt(n); }
function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.floor((new Date(b) - new Date(a)) / 86400000); }
function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result.split(',')[1]);
    r.onerror = ()=> reject(new Error('Could not read file'));
    r.readAsDataURL(file);
  });
}

async function extractInvoiceFromFile(file){
  const base64 = await fileToBase64(file);
  const mediaType = file.type || (file.name.toLowerCase().endsWith('.pdf') ? 'application/pdf' : 'image/jpeg');
  const contentBlock = mediaType === 'application/pdf'
    ? { type: 'document', source: { type: 'base64', media_type: mediaType, data: base64 } }
    : { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } };

  const instruction = `This is a sales invoice this business sent to one of its customers. Extract it into JSON only — no markdown fences, no preamble, no commentary, just the JSON object. Schema:
{"invoice_number": string, "date": "YYYY-MM-DD", "customer": string, "terms_days": number, "items": [{"description": string, "qty": number, "rate": number}]}
Rules:
- Convert the date to YYYY-MM-DD even if the invoice uses DD-MM-YYYY or another format.
- If terms are written like "NET 30", set terms_days to 30. If no terms are shown, use 30.
- Use whatever identifies the customer on the invoice (a name, or a customer ID/number if that's all that's shown) as "customer".
- Only include real line items with a description, quantity and unit price/rate — skip blank rows and skip subtotal/total rows.
- Ignore currency symbols/suffixes like "/-", "₹", "Rs." in the numbers — return plain numbers only.
Return only the JSON object, nothing else.`;

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1500,
      messages: [{ role: 'user', content: [contentBlock, { type: 'text', text: instruction }] }]
    })
  });
  const data = await response.json();
  const textBlock = (data.content || []).find(c => c.type === 'text');
  if(!textBlock) throw new Error('No response from parser');
  const clean = textBlock.text.replace(/```json|```/g, '').trim();
  const parsed = JSON.parse(clean);
  if(!Array.isArray(parsed.items) || !parsed.items.length) throw new Error('No line items found');
  return parsed;
}

async function loadAll(){
  for (const key of ['purchases','sales','payments']){
    try{
      const res = await window.storage.get(key, false);
      state[key] = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      state[key] = [];
    }
  }
  state.loaded = true;
}
async function persist(key){
  try{
    await window.storage.set(key, JSON.stringify(state[key]), false);
  }catch(e){
    console.error('save failed', key, e);
  }
}

// ---------- derived computations ----------
function itemSummary(){
  const items = {};
  const ensure = (name) => {
    if(!items[name]) items[name] = {name, boughtQty:0, boughtValue:0, soldQty:0, soldValue:0};
    return items[name];
  };
  state.purchases.forEach(p=>{
    const it = ensure(p.item);
    it.boughtQty += p.qty; it.boughtValue += p.qty*p.rate;
  });
  state.sales.forEach(s=>{
    const it = ensure(s.item);
    it.soldQty += s.qty; it.soldValue += s.qty*s.rate;
  });
  return Object.values(items).map(it=>{
    const avgBuy = it.boughtQty ? it.boughtValue/it.boughtQty : 0;
    const avgSell = it.soldQty ? it.soldValue/it.soldQty : 0;
    const remainingQty = it.boughtQty - it.soldQty;
    const remainingCostValue = remainingQty * avgBuy;
    const realizedProfit = it.soldValue - (it.soldQty*avgBuy);
    return {...it, avgBuy, avgSell, remainingQty, remainingCostValue, realizedProfit};
  }).sort((a,b)=>a.name.localeCompare(b.name));
}

// FIFO allocation of payments against a customer's sales, oldest sale first
function customerLedger(customer){
  const sales = state.sales.filter(s=>s.customer===customer).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const totalPaid = state.payments.filter(p=>p.customer===customer).reduce((s,p)=>s+p.amount,0);
  let remaining = totalPaid;
  const rows = sales.map(s=>{
    const amt = s.qty*s.rate;
    const applied = Math.min(remaining, amt);
    remaining -= applied;
    const due = amt - applied;
    const overdue = due > 0.005 && daysBetween(s.date, todayStr()) > 30;
    return {...s, amount:amt, paid:applied, due, overdue};
  });
  const totalSales = rows.reduce((s,r)=>s+r.amount,0);
  const totalDue = rows.reduce((s,r)=>s+r.due,0);
  const advance = remaining; // payments beyond what's owed
  return {rows, totalSales, totalPaid, totalDue, advance};
}

function allCustomers(){
  const set = new Set();
  state.sales.forEach(s=>set.add(s.customer));
  state.payments.forEach(p=>set.add(p.customer));
  return Array.from(set).sort();
}

function dashboardTotals(){
  const items = itemSummary();
  const stockCostValue = items.reduce((s,it)=>s+Math.max(it.remainingCostValue,0),0);
  const totalCashOutForPurchases = state.purchases.reduce((s,p)=>s+p.qty*p.rate,0);
  const totalSalesValue = state.sales.reduce((s,sl)=>s+sl.qty*sl.rate,0);
  const totalReceived = state.payments.reduce((s,p)=>s+p.amount,0);
  const customers = allCustomers();
  let totalDue = 0, overdueDue = 0;
  customers.forEach(c=>{
    const led = customerLedger(c);
    totalDue += led.totalDue;
    overdueDue += led.rows.filter(r=>r.overdue).reduce((s,r)=>s+r.due,0);
  });
  const realizedProfit = items.reduce((s,it)=>s+it.realizedProfit,0);
  return {stockCostValue, totalCashOutForPurchases, totalSalesValue, totalReceived, totalDue, overdueDue, realizedProfit};
}

// ---------- rendering ----------
function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  TABS.forEach(t=>{
    const b = document.createElement('button');
    b.className = 'navbtn' + (state.tab===t.id ? ' active':'');
    b.textContent = t.label;
    b.onclick = ()=>{ state.tab = t.id; render(); };
    nav.appendChild(b);
  });
}

function render(){
  renderNav();
  const main = document.getElementById('main');
  main.innerHTML = '';
  if(state.tab==='dashboard') renderDashboard(main);
  else if(state.tab==='purchases') renderPurchases(main);
  else if(state.tab==='sales') renderSales(main);
  else if(state.tab==='payments') renderPayments(main);
  else if(state.tab==='stock') renderStock(main);
  else if(state.tab==='parties') renderParties(main);
}

function renderDashboard(main){
  const t = dashboardTotals();
  main.innerHTML = `
    <h1>Dashboard</h1>
    <p class="subtitle">A running picture of stock, cash paid out, and what's still owed to you.</p>
    <div class="grid">
      <div class="stat"><div class="label">Stock on hand (at cost)</div><div class="value">${money(t.stockCostValue)}</div></div>
      <div class="stat"><div class="label">Paid out for purchases</div><div class="value">${money(t.totalCashOutForPurchases)}</div></div>
      <div class="stat"><div class="label">Total sales value</div><div class="value">${money(t.totalSalesValue)}</div></div>
      <div class="stat"><div class="label">Received from customers</div><div class="value good">${money(t.totalReceived)}</div></div>
      <div class="stat"><div class="label">Outstanding (all customers)</div><div class="value ${t.totalDue>0?'rust':''}">${money(t.totalDue)}</div></div>
      <div class="stat"><div class="label">Overdue (past 30 days)</div><div class="value ${t.overdueDue>0?'rust':''}">${money(t.overdueDue)}</div></div>
      <div class="stat"><div class="label">Realized profit (sold goods)</div><div class="value good">${money(t.realizedProfit)}</div></div>
      <div class="stat"><div class="label">Entries logged</div><div class="value">${state.purchases.length + state.sales.length + state.payments.length}</div></div>
    </div>
    <section class="block">
      <div class="block-head"><h2>Recent activity</h2></div>
      ${recentActivityTable()}
    </section>
  `;
}

function recentActivityTable(){
  const events = [
    ...state.purchases.map(p=>({date:p.date, type:'Purchase', detail:`${p.item} — ${fmt(p.qty)} @ ${money(p.rate)}`, amount:p.qty*p.rate, sign:-1})),
    ...state.sales.map(s=>({date:s.date, type:'Sale', detail:`${s.item} — ${fmt(s.qty)} @ ${money(s.rate)} to ${s.customer}`, amount:s.qty*s.rate, sign:1})),
    ...state.payments.map(p=>({date:p.date, type:'Payment received', detail:`from ${p.customer}${p.notes?' — '+p.notes:''}`, amount:p.amount, sign:1})),
  ].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,12);
  if(!events.length) return `<p class="hint">Nothing logged yet — add a purchase or sale to get started.</p>`;
  return `<table><thead><tr><th>Date</th><th>Type</th><th>Detail</th><th class="num">Amount</th></tr></thead><tbody>
    ${events.map(e=>`<tr><td>${e.date}</td><td>${e.type}</td><td>${e.detail}</td><td class="num">${money(e.amount)}</td></tr>`).join('')}
  </tbody></table>`;
}

function renderPurchases(main){
  main.innerHTML = `
    <h1>Purchases</h1>
    <p class="subtitle">Log stock you've bought for cash.</p>
    <div class="form-card">
      <h2>Add a purchase</h2>
      <form id="purchaseForm">
        <div class="form-row">
          <div class="field"><label>Date</label><input type="date" name="date" value="${todayStr()}" required></div>
          <div class="field"><label>Item</label><input type="text" name="item" placeholder="e.g. Basmati rice" required></div>
          <div class="field"><label>Quantity</label><input type="number" step="any" name="qty" placeholder="0" required></div>
          <div class="field"><label>Rate per unit</label><input type="number" step="any" name="rate" placeholder="0.00" required></div>
          <div class="field"><label>Supplier (optional)</label><input type="text" name="supplier" placeholder="e.g. Ramesh"></div>
          <button class="submit-btn" type="submit">Add purchase</button>
        </div>
      </form>
      <div class="err" id="purchaseErr">Please fill in item, quantity and rate.</div>
    </div>
    <section class="block">
      <div class="block-head"><h2>All purchases</h2><span class="count">${state.purchases.length} entries</span></div>
      ${purchasesTable()}
    </section>
  `;
  document.getElementById('purchaseForm').onsubmit = async (e)=>{
    e.preventDefault();
    const f = e.target;
    const qty = parseFloat(f.qty.value), rate = parseFloat(f.rate.value);
    if(!f.item.value.trim() || !(qty>0) || !(rate>=0)){
      document.getElementById('purchaseErr').style.display='block'; return;
    }
    state.purchases.push({id:uid(), date:f.date.value||todayStr(), item:f.item.value.trim(), qty, rate, supplier:f.supplier.value.trim()});
    await persist('purchases');
    render();
  };
}

function purchasesTable(){
  if(!state.purchases.length) return `<table><tbody><tr class="empty-row"><td>No purchases logged yet.</td></tr></tbody></table>`;
  const rows = [...state.purchases].sort((a,b)=>new Date(b.date)-new Date(a.date));
  return `<table><thead><tr>
    <th>Date</th><th>Item</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th><th>Supplier</th><th></th>
  </tr></thead><tbody>
    ${rows.map(p=>`<tr>
      <td>${p.date}</td><td>${p.item}</td><td class="num">${fmt(p.qty)}</td><td class="num">${money(p.rate)}</td>
      <td class="num">${money(p.qty*p.rate)}</td><td>${p.supplier||'—'}</td>
      <td><button class="del-btn" onclick="deleteEntry('purchases','${p.id}')">Remove</button></td>
    </tr>`).join('')}
  </tbody></table>`;
}

function renderSales(main){
  main.innerHTML = `
    <h1>Sales</h1>
    <p class="subtitle">Log stock sold on credit — payment tracked separately.</p>
    <div class="form-card">
      <h2>Import from an invoice</h2>
      <p class="hint" style="margin-bottom:12px;">Upload the invoice you sent this customer (PDF or a photo of it) — the line items, quantities and rates will be read automatically so you don't have to retype them.</p>
      <input type="file" id="invoiceFile" accept="application/pdf,image/png,image/jpeg" style="display:none">
      <div class="form-row" style="align-items:center;">
        <button class="submit-btn" type="button" id="importBtn" ${state.importing?'disabled':''}>${state.importing ? 'Reading invoice…' : 'Choose invoice file'}</button>
        ${state.importError ? `<span class="err" style="display:block; margin:0;">${escapeHtml(state.importError)}</span>` : ''}
      </div>
    </div>
    ${state.invoiceDraft ? draftCard() : ''}
    <div class="form-card">
      <h2>Add a sale manually</h2>
      <form id="saleForm">
        <div class="form-row">
          <div class="field"><label>Date</label><input type="date" name="date" value="${todayStr()}" required></div>
          <div class="field"><label>Item</label><input type="text" name="item" placeholder="e.g. Basmati rice" required></div>
          <div class="field"><label>Quantity</label><input type="number" step="any" name="qty" placeholder="0" required></div>
          <div class="field"><label>Rate per unit</label><input type="number" step="any" name="rate" placeholder="0.00" required></div>
          <div class="field"><label>Customer</label><input type="text" name="customer" placeholder="e.g. Suresh Traders" required></div>
          <button class="submit-btn" type="submit">Add sale</button>
        </div>
      </form>
      <div class="err" id="saleErr">Please fill in item, quantity, rate and customer.</div>
    </div>
    <section class="block">
      <div class="block-head"><h2>All sales</h2><span class="count">${state.sales.length} entries</span></div>
      ${salesTable()}
    </section>
  `;
  document.getElementById('saleForm').onsubmit = async (e)=>{
    e.preventDefault();
    const f = e.target;
    const qty = parseFloat(f.qty.value), rate = parseFloat(f.rate.value);
    if(!f.item.value.trim() || !f.customer.value.trim() || !(qty>0) || !(rate>=0)){
      document.getElementById('saleErr').style.display='block'; return;
    }
    state.sales.push({id:uid(), date:f.date.value||todayStr(), item:f.item.value.trim(), qty, rate, customer:f.customer.value.trim()});
    await persist('sales');
    render();
  };
  const fileInput = document.getElementById('invoiceFile');
  document.getElementById('importBtn').onclick = ()=> fileInput.click();
  fileInput.onchange = async ()=>{
    const file = fileInput.files[0];
    if(!file) return;
    state.importing = true; state.importError = ''; render();
    try{
      const parsed = await extractInvoiceFromFile(file);
      state.invoiceDraft = parsed;
    }catch(err){
      console.error(err);
      state.importError = "Couldn't read that invoice automatically — try a clearer file, or enter the sale manually below.";
    }
    state.importing = false;
    render();
  };
}

function draftCard(){
  const d = state.invoiceDraft;
  return `
    <div class="form-card">
      <h2>Review invoice ${d.invoice_number ? '#'+escapeHtml(d.invoice_number) : ''} before adding</h2>
      <p class="hint" style="margin-bottom:12px;">Check the customer, date and line items below — edit anything that's off, then add them as sales.</p>
      <div class="form-row">
        <div class="field"><label>Customer</label><input type="text" id="draftCustomer" value="${escapeHtml(d.customer)}"></div>
        <div class="field"><label>Date</label><input type="date" id="draftDate" value="${escapeHtml(d.date || todayStr())}"></div>
        <div class="field"><label>Credit terms (days)</label><input type="number" id="draftTerms" value="${d.terms_days || 30}"></div>
      </div>
      <table><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Rate</th><th></th></tr></thead>
      <tbody id="draftItemsBody">
        ${d.items.map((it,i)=>`<tr data-idx="${i}">
          <td><input type="text" class="draft-item-desc" value="${escapeHtml(it.description)}" style="width:100%;"></td>
          <td class="num"><input type="number" step="any" class="draft-item-qty" value="${it.qty}" style="width:75px; text-align:right;"></td>
          <td class="num"><input type="number" step="any" class="draft-item-rate" value="${it.rate}" style="width:85px; text-align:right;"></td>
          <td><button class="del-btn" type="button" onclick="removeDraftRow(${i})">Remove</button></td>
        </tr>`).join('')}
      </tbody></table>
      <div class="form-row" style="margin-top:14px;">
        <button class="submit-btn" type="button" onclick="confirmDraft()">Add ${d.items.length} item${d.items.length===1?'':'s'} as sales</button>
        <button class="del-btn" type="button" onclick="cancelDraft()">Discard</button>
      </div>
    </div>
  `;
}

window.removeDraftRow = (i)=>{
  state.invoiceDraft.items.splice(i,1);
  if(!state.invoiceDraft.items.length) state.invoiceDraft = null;
  render();
};

window.cancelDraft = ()=>{
  state.invoiceDraft = null;
  render();
};

window.confirmDraft = async ()=>{
  const customer = (document.getElementById('draftCustomer').value || '').trim();
  const date = document.getElementById('draftDate').value || todayStr();
  const invoiceNum = state.invoiceDraft.invoice_number || '';
  if(!customer){ alert('Please enter a customer name before adding.'); return; }
  const rows = document.querySelectorAll('#draftItemsBody tr');
  let added = 0;
  rows.forEach(row=>{
    const desc = row.querySelector('.draft-item-desc').value.trim();
    const qty = parseFloat(row.querySelector('.draft-item-qty').value);
    const rate = parseFloat(row.querySelector('.draft-item-rate').value);
    if(desc && qty > 0 && rate >= 0){
      state.sales.push({id:uid(), date, item:desc, qty, rate, customer, invoice:invoiceNum});
      added++;
    }
  });
  if(!added){ alert('No valid item rows to add.'); return; }
  state.invoiceDraft = null;
  await persist('sales');
  render();
};

function salesTable(){
  if(!state.sales.length) return `<table><tbody><tr class="empty-row"><td>No sales logged yet.</td></tr></tbody></table>`;
  const rows = [...state.sales].sort((a,b)=>new Date(b.date)-new Date(a.date));
  return `<table><thead><tr>
    <th>Date</th><th>Item</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th><th>Customer</th><th>Invoice</th><th></th>
  </tr></thead><tbody>
    ${rows.map(s=>`<tr>
      <td>${s.date}</td><td>${s.item}</td><td class="num">${fmt(s.qty)}</td><td class="num">${money(s.rate)}</td>
      <td class="num">${money(s.qty*s.rate)}</td><td>${s.customer}</td><td>${s.invoice||'—'}</td>
      <td><button class="del-btn" onclick="deleteEntry('sales','${s.id}')">Remove</button></td>
    </tr>`).join('')}
  </tbody></table>`;
}

function renderPayments(main){
  const customers = allCustomers();
  main.innerHTML = `
    <h1>Payments received</h1>
    <p class="subtitle">Record lump-sum payments — they're applied to a customer's oldest unpaid sales first.</p>
    <div class="form-card">
      <h2>Add a payment</h2>
      <form id="paymentForm">
        <div class="form-row">
          <div class="field"><label>Date</label><input type="date" name="date" value="${todayStr()}" required></div>
          <div class="field"><label>Customer</label><input type="text" name="customer" list="customerList" placeholder="e.g. Suresh Traders" required></div>
          <datalist id="customerList">${customers.map(c=>`<option value="${c}">`).join('')}</datalist>
          <div class="field"><label>Amount received</label><input type="number" step="any" name="amount" placeholder="0.00" required></div>
          <div class="field"><label>Note (optional)</label><input type="text" name="notes" placeholder="e.g. cheque #1234"></div>
          <button class="submit-btn" type="submit">Add payment</button>
        </div>
      </form>
      <div class="err" id="paymentErr">Please fill in customer and amount.</div>
    </div>
    <section class="block">
      <div class="block-head"><h2>All payments</h2><span class="count">${state.payments.length} entries</span></div>
      ${paymentsTable()}
    </section>
  `;
  document.getElementById('paymentForm').onsubmit = async (e)=>{
    e.preventDefault();
    const f = e.target;
    const amount = parseFloat(f.amount.value);
    if(!f.customer.value.trim() || !(amount>0)){
      document.getElementById('paymentErr').style.display='block'; return;
    }
    state.payments.push({id:uid(), date:f.date.value||todayStr(), customer:f.customer.value.trim(), amount, notes:f.notes.value.trim()});
    await persist('payments');
    render();
  };
}

function paymentsTable(){
  if(!state.payments.length) return `<table><tbody><tr class="empty-row"><td>No payments logged yet.</td></tr></tbody></table>`;
  const rows = [...state.payments].sort((a,b)=>new Date(b.date)-new Date(a.date));
  return `<table><thead><tr>
    <th>Date</th><th>Customer</th><th class="num">Amount</th><th>Note</th><th></th>
  </tr></thead><tbody>
    ${rows.map(p=>`<tr>
      <td>${p.date}</td><td>${p.customer}</td><td class="num">${money(p.amount)}</td><td>${p.notes||'—'}</td>
      <td><button class="del-btn" onclick="deleteEntry('payments','${p.id}')">Remove</button></td>
    </tr>`).join('')}
  </tbody></table>`;
}

function renderStock(main){
  const items = itemSummary();
  main.innerHTML = `
    <h1>Stock by item</h1>
    <p class="subtitle">What you've bought, sold, and hold right now, item by item.</p>
    <section class="block">
      ${items.length ? `<table><thead><tr>
        <th>Item</th><th class="num">Bought</th><th class="num">Avg buy rate</th>
        <th class="num">Sold</th><th class="num">Avg sell rate</th>
        <th class="num">In stock</th><th class="num">Stock value (cost)</th><th class="num">Realized profit</th>
      </tr></thead><tbody>
        ${items.map(it=>`<tr>
          <td>${it.name}</td>
          <td class="num">${fmt(it.boughtQty)}</td>
          <td class="num">${money(it.avgBuy)}</td>
          <td class="num">${fmt(it.soldQty)}</td>
          <td class="num">${it.soldQty? money(it.avgSell) : '—'}</td>
          <td class="num">${fmt(it.remainingQty)}</td>
          <td class="num">${money(Math.max(it.remainingCostValue,0))}</td>
          <td class="num ${it.realizedProfit<0?'':''}" style="color:${it.realizedProfit<0?'var(--rust)':'var(--good)'}">${money(it.realizedProfit)}</td>
        </tr>`).join('')}
      </tbody></table>` : `<p class="hint">No items yet — add purchases and sales to see stock levels here.</p>`}
    </section>
  `;
}

function renderParties(main){
  const customers = allCustomers();
  main.innerHTML = `
    <h1>Customer dues</h1>
    <p class="subtitle">Outstanding balance per customer, with sales matched to payments oldest-first.</p>
    <section class="block">
      ${customers.length ? customers.map(c=>{
        const led = customerLedger(c);
        return `
        <div class="form-card" style="margin-bottom:18px;">
          <div class="block-head" style="border-bottom:none; margin-bottom:8px; padding-bottom:0;">
            <h2>${c}</h2>
            <span class="count">${money(led.totalDue)} outstanding${led.advance>0.005 ? ' · '+money(led.advance)+' advance' : ''}</span>
          </div>
          <table><thead><tr>
            <th>Date</th><th>Item</th><th class="num">Amount</th><th class="num">Paid</th><th class="num">Due</th><th>Status</th>
          </tr></thead><tbody>
            ${led.rows.map(r=>`<tr>
              <td>${r.date}</td><td>${r.item}</td>
              <td class="num">${money(r.amount)}</td><td class="num">${money(r.paid)}</td><td class="num">${money(r.due)}</td>
              <td>${r.due<=0.005 ? '<span class="tag paid">Paid</span>' : (r.overdue ? '<span class="tag overdue">Overdue</span>' : '<span class="tag open">Within terms</span>')}</td>
            </tr>`).join('')}
          </tbody></table>
        </div>`;
      }).join('') : `<p class="hint">No customers yet — add a sale to start tracking dues.</p>`}
    </section>
  `;
}

window.deleteEntry = async (bucket, id) => {
  state[bucket] = state[bucket].filter(x=>x.id!==id);
  await persist(bucket);
  render();
};

(async function init(){
  document.getElementById('main').innerHTML = '<p class="hint" style="margin-top:40px;">Loading your ledger…</p>';
  await loadAll();
  render();
})();
</script>
</body>
</html>
